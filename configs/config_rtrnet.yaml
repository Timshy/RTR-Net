seed: 42
device: cuda

data:
  train_image_dir: data/WHU-RuRp/images
  train_mask_dir: data/WHU-RuRp/masks
  train_response_dir: data/WHU-RuRp/responses
  val_image_dir: data/WHU-RuRp/val_images
  val_mask_dir: data/WHU-RuRp/val_masks
  val_response_dir: data/WHU-RuRp/val_responses
  image_size: 512

model:
  in_channels: 4
  base_channels: 32
  skel_loss_weight: 0.5

train:
  epochs: 3
  batch_size: 6
  num_workers: 4
  lr: 0.001
  weight_decay: 0.0001
  save_dir: checkpoints
